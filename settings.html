<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Terminal - Server Setup</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h2 { color: #333; margin-bottom: 5px; font-size: 20px; text-align: center; }
    p { color: #666; font-size: 13px; margin-bottom: 20px; text-align: center; }
    label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-top: 10px; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    .status { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
    .note { margin-top: 15px; font-size: 11px; color: #d9534f; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>POS Terminal Settings</h2>
    <p>സെർവർ വിവരങ്ങളും പ്രിന്റർ ക്രമീകരണങ്ങളും</p>
    
    <label>Server URL & Port:</label>
    <input type="text" id="serverUrl" placeholder="http://192.168.1.50:5070">

    <label>Terminal ID (ഉദാ: 1, 2, 3):</label>
    <input type="text" id="terminalId" placeholder="1">

    <label>Printer Type (പ്രിന്റർ തരം):</label>
    <select id="printerType">
      <option value="thermal">Thermal Printer (80mm)</option>
      <option value="a4">A4 Printer</option>
    </select>

    <label>Select Printer Name:</label>
    <select id="printerSelect">
      <option value="">-- Default Printer --</option>
    </select>

    <button onclick="saveAndConnect()">Save & Connect</button>
    
    <div class="status" id="statusMsg"></div>
    <div class="note">ശ്രദ്ധിക്കുക: ഭാവിയിൽ ഐപിയോ പ്രിന്ററോ മാറ്റാൻ കീബോർഡിലെ <b>F2</b> കീ അമർത്തുക.</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    window.addEventListener('DOMContentLoaded', async () => {
      const config = await ipcRenderer.invoke('get-config');
      if (config.url) document.getElementById('serverUrl').value = config.url;
      if (config.terminalId) document.getElementById('terminalId').value = config.terminalId;
      if (config.printerType) document.getElementById('printerType').value = config.printerType;

      try {
        const printers = await ipcRenderer.invoke('get-printers');
        const printerSelect = document.getElementById('printerSelect');
        printers.forEach(printer => {
          const opt = document.createElement('option');
          opt.value = printer.name;
          opt.text = printer.name + (printer.isDefault ? ' (Default)' : '');
          if (config.printerName === printer.name) {
            opt.selected = true;
          }
          printerSelect.appendChild(opt);
        });
      } catch (e) {
        console.error('Error loading printers:', e);
      }
    });

    async function saveAndConnect() {
      const url = document.getElementById('serverUrl').value.trim();
      const terminalId = document.getElementById('terminalId').value.trim() || "1";
      const printerType = document.getElementById('printerType').value;
      const printerName = document.getElementById('printerSelect').value;

      if (!url) {
        alert('ദയവായി സെർവർ ഐപി നൽകുക!');
        return;
      }
      
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.innerText = 'Saving...';

      const res = await ipcRenderer.invoke('save-config', { url, terminalId, printerType, printerName });
      if (res.success) {
        alert('സെറ്റിങ്സ് സേവ് ചെയ്തു! ആപ്പ് കണക്റ്റ് ആകുന്നു...');
        window.location.href = url;
      } else {
        statusMsg.innerText = 'Error saving settings!';
      }
    }
  </script>
</body>
</html>
